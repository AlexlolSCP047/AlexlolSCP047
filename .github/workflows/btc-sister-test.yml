name: BTC Sister Models Test

on:
  push:
    branches:
      - claude/professional-video-animation-SOLoe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r btc_engine/requirements.txt
      - name: Run real Binance test
        run: python btc_engine/btc_sister_engine.py
      - name: Show report
        run: cat btc_reports/latest.md
      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_reports/
          git diff --cached --quiet || git commit -m "Update BTC sister-model report [skip ci]"
          git push
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-sister-report
          path: btc_reports/
